[project]
name = "pocketknife"
version = "0.1.0"
description = "Pocket Knife: Rhino 8 commands and Grasshopper components in pure Python."
license = "MIT"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "B", "UP"]
ignore = [
    "N802",  # RhinoCommon naming in overrides.
    "N813",  # `import Rhino.Geometry as rg` is the Rhino convention.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# Prototypes add ../src to sys.path before importing; file names are command names.
"sandbox/*" = ["E402", "N999"]
"commands/*" = ["E402", "N999"]
# Grasshopper scripts: inputs and ghenv are injected globals.
"grasshopper/*" = ["E402", "N999", "N816", "F821", "E741"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
